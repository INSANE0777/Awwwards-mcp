name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Gate - tag matches CHANGELOG section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "^## v${VERSION}" CHANGELOG.md || { echo "CHANGELOG.md has no '## v${VERSION}' section - add release notes before tagging"; exit 1; }

      - name: Gate - version already on npm?
        id: npmcheck
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "awwwards-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "awwwards-mcp@${VERSION} is already on npm - skipping publish, still creating the GitHub Release"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

      - name: Publish (beta tag when prerelease)
        if: steps.npmcheck.outputs.published != 'true'
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --tag beta
          else
            npm publish --tag latest
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## v${VERSION}/{flag=1;next} /^## v/{flag=0} flag" CHANGELOG.md > body.md
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            FLAGS="--prerelease"
          else
            FLAGS=""
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "awwwards-mcp ${GITHUB_REF_NAME}" --notes-file body.md
          else
            gh release create "$GITHUB_REF_NAME" $FLAGS --title "awwwards-mcp ${GITHUB_REF_NAME}" --notes-file body.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
