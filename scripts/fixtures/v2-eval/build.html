<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V2 Eval Build</title>
<style>
  :root { --ink: #101216; --paper: #f4f1ea; --accent: #e4572e; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: var(--paper); font-family: "Helvetica Neue", Arial, sans-serif; }
  .site-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 40px; border-bottom: 1px solid rgb(16 18 22 / 10%); }
  .brand { font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
  .nav { display: flex; gap: 22px; }
  .nav a { color: inherit; text-decoration: none; font-size: 13px; }
  .nav a:hover { color: var(--accent); }
  .btn { padding: 10px 18px; border: 1px solid var(--ink); border-radius: 999px; background: transparent; font: inherit; cursor: pointer; transition: background 220ms ease, color 220ms ease; }
  .btn:hover { background: var(--ink); color: var(--paper); }
  main > section { min-height: 70vh; padding: 90px 40px; }
  .hero { background: #101216; color: var(--paper); }
  .hero h1 { max-width: 12ch; margin: 0 0 24px; font-size: clamp(44px, 8vw, 112px); line-height: 0.94; }
  .work { background: #fff; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 40px; }
  .card { display: block; padding: 20px; color: inherit; text-decoration: none; border: 1px solid rgb(16 18 22 / 14%); border-radius: 6px; background: var(--paper); }
  .card img { width: 100%; height: 150px; object-fit: cover; }
  .contact { background: var(--ink); color: var(--paper); }
  @keyframes rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
  .reveal { animation: rise linear both; animation-timeline: view(); }
</style>
</head>
<body>
<header class="site-header" id="top">
  <span class="brand">Keep&amp;Co</span>
  <nav class="nav" aria-label="Primary"><a href="#work">Work</a><a href="#about">About</a></nav>
  <button class="btn" type="button">Start a project</button>
</header>
<main>
  <section class="hero" id="hero">
    <h1>We build quiet, exacting websites.</h1>
    <p>Rebuild fixture for verify_build.</p>
  </section>
  <section class="work" id="work">
    <h2 class="reveal">Selected work</h2>
    <div class="grid">
      <a class="card" href="#work"><img src="/img/one.svg" width="480" height="300" alt=""><h3>Field Notes</h3></a>
      <a class="card" href="#work"><img src="/img/two.svg" width="480" height="300" alt=""><h3>North Window</h3></a>
    </div>
  </section>
  <section class="contact" id="contact">
    <h2 class="reveal">Say hello.</h2>
    <p><a class="btn" href="mailto:hello@example.test">hello@example.test</a></p>
  </section>
</main>
</body>
</html>
